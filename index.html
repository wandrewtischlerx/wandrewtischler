<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WANDREW.RUN</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#f0f4ff;touch-action:none;}
canvas{display:block;position:fixed;top:0;left:0;touch-action:none;}

#ui{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10;font-family:'Rajdhani',sans-serif;}
.hpwrap{display:flex;flex-direction:column;gap:5px;}
.lbl{font-size:10px;letter-spacing:3px;color:#7a8aaa;font-family:'Share Tech Mono',monospace;}
.barbg{width:130px;height:7px;background:#dde3f5;border:1px solid #b0bde0;border-radius:3px;overflow:hidden;}
#hpfill{height:100%;background:linear-gradient(90deg,#1a5aff,#2563eb);border-radius:3px;transition:width .15s;}
#scorenum{font-size:26px;font-weight:700;color:#1a2040;text-align:right;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}
#wavenum{font-size:10px;letter-spacing:3px;color:#7a8aaa;text-align:right;margin-top:1px;font-family:'Share Tech Mono',monospace;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f0f4ff;z-index:50;padding:30px;font-family:'Rajdhani',sans-serif;}
.screen.hide{display:none;}

/* TITLE */
.brand-wrap{display:flex;align-items:baseline;gap:0;}
.brand-tek{font-size:58px;font-weight:700;color:#1a2040;letter-spacing:-1px;line-height:1;}
.brand-braz{font-size:58px;font-weight:700;color:#2563eb;letter-spacing:-1px;line-height:1;}
.game-tag{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:6px;color:#8a9abf;margin-top:6px;text-align:center;}
.div{width:40px;height:2px;background:#2563eb;margin:26px 0;border-radius:2px;}
.instruct{text-align:center;color:#5a6a8a;font-size:15px;line-height:2.3;font-weight:500;}
.instruct b{color:#2563eb;}
.wandrew-tag{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:4px;color:#aabbd0;margin-top:20px;}

.btn{margin-top:28px;padding:15px 44px;background:#2563eb;border:none;color:#fff;font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:5px;cursor:pointer;border-radius:4px;touch-action:manipulation;}
.btn:active{background:#1a4fc8;transform:scale(.97);}

/* DEATH */
.dtitle{font-size:38px;font-weight:700;color:#1a2040;letter-spacing:3px;}
.dscore{font-size:56px;font-weight:700;color:#2563eb;margin:8px 0;letter-spacing:2px;}
.dsub{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;color:#8a9abf;}
.dwave{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;color:#aabbd0;margin-top:8px;}
.dbrand{font-size:13px;color:#b0c0d8;margin-top:18px;font-weight:500;}
.dbrand span{color:#2563eb;}

/* DASH BTN */
#dashbtn{position:fixed;bottom:36px;right:32px;width:76px;height:76px;border-radius:50%;border:2px solid #2563eb;background:rgba(240,244,255,.9);color:#2563eb;font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:2px;z-index:20;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 12px rgba(37,99,235,.2);}
#dashbtn.off{border-color:#c0cce8;color:#c0cce8;box-shadow:none;}
#dashicon{font-size:22px;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="hpwrap">
    <div class="lbl">ENERGIA</div>
    <div class="barbg"><div id="hpfill"></div></div>
  </div>
  <div>
    <div id="scorenum">0</div>
    <div id="wavenum">FASE 1</div>
  </div>
</div>

<button id="dashbtn" aria-label="Dash"><span id="dashicon">&#9889;</span>DASH</button>

<!-- TITLE -->
<div id="titlescreen" class="screen">
  <div class="brand-wrap">
    <span class="brand-tek">tek</span><span class="brand-braz">braz</span>
  </div>
  <div class="game-tag">WANDREW.RUN · ARCADE</div>
  <div class="div"></div>
  <div class="instruct">
    <b>MOVER</b> — arraste o lado esquerdo<br>
    <b>DASH</b> — botão direito (invencível)<br>
    <b>ATACAR</b> — automático<br>
    <b>DADOS</b> — colete para recuperar energia
  </div>
  <button class="btn" id="startbtn">INICIAR</button>
  <div class="wandrew-tag">wandrew.com.br</div>
</div>

<!-- DEATH -->
<div id="deathscreen" class="screen hide">
  <div class="dtitle">GAME OVER</div>
  <div class="dscore" id="finalscore">0</div>
  <div class="dsub">BYTES COLETADOS</div>
  <div class="dwave" id="finalwave"></div>
  <div class="dbrand">by <span>Wandrew</span> · wandrew.com.br</div>
  <button class="btn" id="restartbtn" style="margin-top:24px">TENTAR NOVAMENTE</button>
</div>

<script>
const cv=document.getElementById('c');
const cx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();
window.addEventListener('resize',resize);

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let running=false,score=0,wave=1,waveT=0,waveDur=18;
let spawnR=1.8,spawnT=0;
let parts=[],enemies=[],bullets=[],pickups=[];

const P={x:0,y:0,r:18,hp:100,maxHp:100,spd:185,
  shootCd:0,shootR:.52,inv:0,
  dashCd:0,dashMaxCd:1.8,dashing:false,dashTimer:0,
  dashVx:0,dashVy:0,angle:0};

const JOY={on:false,pid:-1,sx:0,sy:0,dx:0,dy:0,maxR:44};

function initGame(){
  P.x=W/2;P.y=H/2;P.hp=P.maxHp;
  P.shootCd=0;P.dashCd=0;P.dashing=false;P.inv=0;
  score=0;wave=1;waveT=0;spawnR=1.8;spawnT=0;waveDur=18;
  enemies=[];bullets=[];parts=[];pickups=[];
  JOY.on=false;JOY.dx=0;JOY.dy=0;
  hud();
}

function hud(){
  document.getElementById('hpfill').style.width=Math.max(0,P.hp/P.maxHp*100)+'%';
  document.getElementById('scorenum').textContent=score;
  document.getElementById('wavenum').textContent='FASE '+wave;
}

// particles
function spark(x,y,col,n,spd,life){
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),s=spd*rnd(.4,1.2);
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life,ml:life,r:rnd(1.5,3.5),col});
  }
}
function explode(x,y){spark(x,y,'#2563eb',8,140,.5);spark(x,y,'#7baafe',6,90,.4);}
function dataPop(x,y){
  pickups.push({x,y,r:7,life:9,vx:rnd(-40,40),vy:rnd(-40,40),type:'data'});
}

// enemies — "bugs" / vírus digitais
function spawnEnemy(){
  const edge=Math.floor(rnd(0,4));
  let x,y,pad=24;
  if(edge===0){x=rnd(0,W);y=-pad;}
  else if(edge===1){x=W+pad;y=rnd(0,H);}
  else if(edge===2){x=rnd(0,W);y=H+pad;}
  else{x=-pad;y=rnd(0,H);}
  const roll=wave<3?0:Math.random();
  let r,spd,hp,col,pts;
  if(roll<.55){r=15;spd=70+wave*9;hp=2+wave;col='#e53e3e';pts=10;}       // bug vermelho
  else if(roll<.82){r=10;spd=120+wave*11;hp=1;col='#d97706';pts=6;}      // spike laranja
  else{r=28;spd=38+wave*5;hp=5+wave*2;col='#6d28d9';pts=28;}             // vírus roxo
  enemies.push({x,y,r,spd,hp,maxHp:hp,col,pts,pt:rnd(0,Math.PI*2)});
}

function shoot(tx,ty){
  const dx=tx-P.x,dy=ty-P.y,l=Math.hypot(dx,dy)||1,spd=430;
  bullets.push({x:P.x,y:P.y,vx:dx/l*spd,vy:dy/l*spd,r:5,life:1.1});
}
function nearest(){
  let best=null,bd=Infinity;
  for(const e of enemies){const d=Math.hypot(e.x-P.x,e.y-P.y);if(d<bd){bd=d;best=e;}}
  return best;
}

let last=0;
function loop(ts){
  if(!running)return;
  const dt=Math.min((ts-last)/1000,.05);last=ts;

  waveT+=dt;
  if(waveT>waveDur){
    wave++;waveT=0;
    spawnR=Math.max(.32,spawnR-.17);
    waveDur=Math.min(waveDur+3,40);
    document.getElementById('wavenum').textContent='FASE '+wave;
    spark(W/2,H/2,'#2563eb',28,200,1);
  }
  spawnT-=dt;
  if(spawnT<=0){
    const n=wave<3?1:(Math.random()<.3?2:1);
    for(let i=0;i<n;i++)spawnEnemy();
    spawnT=spawnR;
  }

  let jx=0,jy=0;
  if(JOY.on){const l=Math.hypot(JOY.dx,JOY.dy);if(l>8){jx=JOY.dx/l;jy=JOY.dy/l;}}

  if(P.dashing){
    P.dashTimer-=dt;
    if(P.dashTimer<=0)P.dashing=false;
    else{P.x+=P.dashVx*dt;P.y+=P.dashVy*dt;}
  }else{
    P.x+=jx*P.spd*dt;P.y+=jy*P.spd*dt;
    if(jx||jy)P.angle=Math.atan2(jy,jx);
  }
  P.x=clamp(P.x,P.r,W-P.r);P.y=clamp(P.y,P.r,H-P.r);
  P.inv=Math.max(0,P.inv-dt);
  if(P.dashCd>0){P.dashCd-=dt;if(P.dashCd<=0){P.dashCd=0;document.getElementById('dashbtn').className='';}}

  P.shootCd-=dt;
  if(P.shootCd<=0){const t=nearest();if(t){shoot(t.x,t.y);P.shootCd=P.shootR;}}

  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];e.pt+=dt*2.2;
    const dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;
    e.x+=dx/l*e.spd*dt;e.y+=dy/l*e.spd*dt;
    if(!P.dashing&&P.inv<=0&&l<e.r+P.r){
      P.hp-=12;P.inv=.85;
      spark(P.x,P.y,'#e53e3e',8,130,.5);
      hud();
      if(P.hp<=0){endGame();return;}
    }
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
        bullets.splice(i,1);e.hp--;
        spark(e.x,e.y,'#7baafe',4,80,.3);
        if(e.hp<=0){
          explode(e.x,e.y);dataPop(e.x,e.y);
          score+=e.pts;document.getElementById('scorenum').textContent=score;
          enemies.splice(j,1);
        }
        break;
      }
    }
  }

  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    const dx=P.x-pk.x,dy=P.y-pk.y,d=Math.hypot(dx,dy);
    if(d<90){pk.vx+=dx/d*220*dt;pk.vy+=dy/d*220*dt;}
    pk.x+=pk.vx*dt;pk.y+=pk.vy*dt;pk.vx*=.91;pk.vy*=.91;pk.life-=dt;
    if(d<pk.r+P.r||pk.life<=0){
      if(d<pk.r+P.r){P.hp=Math.min(P.maxHp,P.hp+8);hud();spark(P.x,P.y,'#2563eb',6,70,.45);}
      pickups.splice(i,1);
    }
  }

  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.87;p.vy*=.87;p.life-=dt;
    if(p.life<=0)parts.splice(i,1);
  }

  draw();
  requestAnimationFrame(loop);
}

// ── DRAW ──
function draw(){
  // background — tech grid light
  cx.fillStyle='#f0f4ff';cx.fillRect(0,0,W,H);

  // dot grid
  cx.fillStyle='rgba(37,99,235,.12)';
  const gs=36;
  for(let x=gs;x<W;x+=gs)for(let y=gs;y<H;y+=gs){
    cx.beginPath();cx.arc(x,y,1.2,0,Math.PI*2);cx.fill();
  }

  // subtle circuit lines
  cx.strokeStyle='rgba(37,99,235,.06)';cx.lineWidth=1;
  for(let x=0;x<W;x+=gs*3){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();}
  for(let y=0;y<H;y+=gs*3){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}

  // particles
  for(const p of parts){
    cx.globalAlpha=p.life/p.ml;
    cx.fillStyle=p.col;cx.beginPath();cx.arc(p.x,p.y,p.r*(p.life/p.ml),0,Math.PI*2);cx.fill();
  }
  cx.globalAlpha=1;

  // data pickups — little "D" chip
  const now=Date.now();
  for(const pk of pickups){
    const a=Math.min(pk.life,1),pulse=1+.22*Math.sin(now*.01);
    cx.globalAlpha=a;
    cx.shadowColor='#2563eb';cx.shadowBlur=12;
    cx.fillStyle='#dbeafe';
    const s=pk.r*pulse*2;
    cx.fillRect(pk.x-s/2,pk.y-s/2,s,s);
    cx.strokeStyle='#2563eb';cx.lineWidth=1.5;
    cx.strokeRect(pk.x-s/2,pk.y-s/2,s,s);
    cx.fillStyle='#1d4ed8';cx.font=`bold ${Math.round(s*.7)}px Rajdhani,sans-serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('D',pk.x,pk.y+1);
    cx.shadowBlur=0;cx.globalAlpha=1;
  }

  // enemies
  for(const e of enemies){
    const pulse=1+.07*Math.sin(e.pt);
    cx.shadowColor=e.col;cx.shadowBlur=14;
    // body
    cx.fillStyle=e.col;cx.globalAlpha=.15;
    cx.beginPath();cx.arc(e.x,e.y,e.r*pulse+5,0,Math.PI*2);cx.fill();
    cx.globalAlpha=1;
    cx.fillStyle=e.col;
    cx.beginPath();cx.arc(e.x,e.y,e.r*pulse,0,Math.PI*2);cx.fill();
    // X mark
    cx.strokeStyle='rgba(255,255,255,.6)';cx.lineWidth=2;
    const s=e.r*.5;
    cx.beginPath();cx.moveTo(e.x-s,e.y-s);cx.lineTo(e.x+s,e.y+s);
    cx.moveTo(e.x+s,e.y-s);cx.lineTo(e.x-s,e.y+s);cx.stroke();
    cx.shadowBlur=0;
    if(e.maxHp>1){
      const bw=e.r*2.4;
      cx.fillStyle='#dde3f5';cx.fillRect(e.x-bw/2,e.y-e.r-9,bw,3);
      cx.fillStyle=e.col;cx.fillRect(e.x-bw/2,e.y-e.r-9,bw*(e.hp/e.maxHp),3);
    }
  }

  // bullets — tech orbs
  for(const b of bullets){
    cx.globalAlpha=b.life/1.1;
    cx.shadowColor='#2563eb';cx.shadowBlur=14;
    cx.fillStyle='#2563eb';cx.beginPath();cx.arc(b.x,b.y,b.r,0,Math.PI*2);cx.fill();
    cx.fillStyle='#93c5fd';cx.beginPath();cx.arc(b.x-1.5,b.y-1.5,b.r*.4,0,Math.PI*2);cx.fill();
    cx.shadowBlur=0;cx.globalAlpha=1;
  }

  // player — hexagonal "W" avatar
  const flash=P.inv>0&&Math.sin(P.inv*28)>0;
  if(!flash){
    cx.save();cx.translate(P.x,P.y);
    cx.shadowColor=P.dashing?'#7baafe':'#2563eb';cx.shadowBlur=P.dashing?28:16;
    // hex body
    cx.fillStyle=P.dashing?'#93c5fd':'#2563eb';
    cx.beginPath();
    for(let i=0;i<6;i++){
      const a=Math.PI/6+i*Math.PI/3;
      i===0?cx.moveTo(Math.cos(a)*P.r,Math.sin(a)*P.r):cx.lineTo(Math.cos(a)*P.r,Math.sin(a)*P.r);
    }
    cx.closePath();cx.fill();
    // W letter
    cx.fillStyle='#fff';cx.font=`bold ${Math.round(P.r*.9)}px Rajdhani,sans-serif`;
    cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText('W',0,1);
    cx.shadowBlur=0;cx.restore();
  }

  // joystick ghost
  if(JOY.on){
    cx.globalAlpha=.1;
    cx.strokeStyle='#2563eb';cx.lineWidth=1.5;
    cx.beginPath();cx.arc(JOY.sx,JOY.sy,JOY.maxR,0,Math.PI*2);cx.stroke();
    cx.globalAlpha=.3;
    const l=Math.hypot(JOY.dx,JOY.dy),cl=Math.min(l,JOY.maxR);
    const nx=l?JOY.dx/l:0,ny=l?JOY.dy/l:0;
    cx.fillStyle='#2563eb';
    cx.beginPath();cx.arc(JOY.sx+nx*cl,JOY.sy+ny*cl,18,0,Math.PI*2);cx.fill();
    cx.globalAlpha=1;
  }

  // wandrew.com.br watermark
  cx.globalAlpha=.18;
  cx.fillStyle='#2563eb';
  cx.font='500 12px Rajdhani,sans-serif';
  cx.textAlign='right';cx.textBaseline='bottom';
  cx.fillText('wandrew.com.br',W-14,H-12);
  cx.globalAlpha=1;
}

// ── CONTROLS ──
const LEFT=()=>W*.58;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  if(e.clientX<LEFT()&&!JOY.on){
    JOY.on=true;JOY.pid=e.pointerId;
    JOY.sx=e.clientX;JOY.sy=e.clientY;JOY.dx=0;JOY.dy=0;
  }
},{passive:false});
cv.addEventListener('pointermove',e=>{
  e.preventDefault();
  if(e.pointerId===JOY.pid){JOY.dx=e.clientX-JOY.sx;JOY.dy=e.clientY-JOY.sy;}
},{passive:false});
cv.addEventListener('pointerup',e=>{
  e.preventDefault();
  if(e.pointerId===JOY.pid){JOY.on=false;JOY.pid=-1;JOY.dx=0;JOY.dy=0;}
},{passive:false});
cv.addEventListener('pointercancel',e=>{
  if(e.pointerId===JOY.pid){JOY.on=false;JOY.pid=-1;JOY.dx=0;JOY.dy=0;}
});

const dashEl=document.getElementById('dashbtn');
dashEl.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();
  if(P.dashCd<=0&&!P.dashing){
    const l=Math.hypot(JOY.dx,JOY.dy);
    const jx=l>8?JOY.dx/l:Math.cos(P.angle);
    const jy=l>8?JOY.dy/l:Math.sin(P.angle);
    P.dashing=true;P.dashTimer=.18;
    P.dashVx=jx*820;P.dashVy=jy*820;
    P.dashCd=P.dashMaxCd;P.inv=.18;
    dashEl.className='off';
    spark(P.x,P.y,'#93c5fd',10,160,.3);
  }
},{passive:false});

function startGame(){
  document.getElementById('titlescreen').classList.add('hide');
  document.getElementById('deathscreen').classList.add('hide');
  dashEl.style.display='flex';
  initGame();running=true;last=performance.now();
  requestAnimationFrame(loop);
}
function endGame(){
  running=false;dashEl.style.display='none';
  document.getElementById('finalscore').textContent=score;
  document.getElementById('finalwave').textContent='CHEGOU NA FASE '+wave;
  document.getElementById('deathscreen').classList.remove('hide');
}

document.getElementById('startbtn').addEventListener('click',startGame);
document.getElementById('restartbtn').addEventListener('click',startGame);
</script>
</body>
</html>
